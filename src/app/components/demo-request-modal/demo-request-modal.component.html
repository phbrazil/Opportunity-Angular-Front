<div class="demo-modal" role="dialog" aria-labelledby="demo-modal-title">
  <div class="modal-heading">
    <div>
      <p class="eyebrow">{{ copy.eyebrow }}</p>
      <h2 id="demo-modal-title">{{ copy.title }}</h2>
      <p class="modal-subtitle">{{ copy.subtitle }}</p>
    </div>
    <button
      type="button"
      class="close-button"
      [attr.aria-label]="copy.close"
      (click)="close()"
    >
      &times;
    </button>
  </div>

  <form [formGroup]="demoForm" (ngSubmit)="submit()" novalidate>
    <div class="field-grid">
      <label class="field">
        <span>{{ copy.name }}</span>
        <input
          type="text"
          formControlName="name"
          [placeholder]="copy.namePlaceholder"
          autocomplete="name"
        />
        <small
          *ngIf="
            demoForm.controls.name.touched && demoForm.controls.name.invalid
          "
          >{{ copy.requiredName }}</small
        >
      </label>

      <label class="field">
        <span>{{ copy.company }}</span>
        <input
          type="text"
          formControlName="company"
          [placeholder]="copy.companyPlaceholder"
          autocomplete="organization"
        />
        <small
          *ngIf="
            demoForm.controls.company.touched &&
            demoForm.controls.company.invalid
          "
          >{{ copy.requiredCompany }}</small
        >
      </label>

      <label class="field">
        <span>{{ copy.email }}</span>
        <input
          type="email"
          formControlName="email"
          [placeholder]="copy.emailPlaceholder"
          autocomplete="email"
        />
        <small
          *ngIf="
            demoForm.controls.email.touched && demoForm.controls.email.invalid
          "
          >{{ copy.requiredEmail }}</small
        >
      </label>

      <label class="field">
        <span>{{ copy.phone }}</span>
        <input
          type="phone"
          formControlName="tel"
          [placeholder]="copy.phonePlaceholder"
          autocomplete="tel"
          mask="(00) 00000-0000"
        />
        <small
          *ngIf="
            demoForm.controls.tel.touched && demoForm.controls.tel.invalid
          "
          >{{ copy.requiredPhone }}</small
        >
      </label>
    </div>

    <label class="field full-width">
      <span>{{ copy.subject }}</span>
      <select formControlName="subject">
        <option value="" disabled>{{ copy.subjectPlaceholder }}</option>
        <option value="payment-automation">{{ copy.subjects[0] }}</option>
        <option value="sap-integration">{{ copy.subjects[1] }}</option>
        <option value="approval-flow">{{ copy.subjects[2] }}</option>
        <option value="other">{{ copy.subjects[3] }}</option>
      </select>
      <small
        *ngIf="
          demoForm.controls.subject.touched && demoForm.controls.subject.invalid
        "
        >{{ copy.requiredSubject }}</small
      >
    </label>

    <label class="field full-width">
      <span>{{ copy.message }}</span>
      <textarea
        formControlName="textarea"
        rows="4"
        [placeholder]="copy.messagePlaceholder"
      ></textarea>
      <small
        *ngIf="
          demoForm.controls.textarea.touched && demoForm.controls.textarea.invalid
        "
        >{{ copy.requiredMessage }}</small
      >
    </label>

    <div class="modal-actions">
      <button
        type="submit"
        class="submit-button"
        [disabled]="demoForm.invalid || (isLoading$ | async)"
      >
        <span
          *ngIf="isLoading$ | async"
          class="loading-spinner"
          aria-hidden="true"
        ></span>
        {{ (isLoading$ | async) ? copy.sending : copy.submit }}
        <span *ngIf="!(isLoading$ | async)" aria-hidden="true">↗</span>
      </button>
    </div>
  </form>
</div>
