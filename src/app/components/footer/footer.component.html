<div class="container">
  <footer class="footer-wrapper col-12 col-md-10 mx-auto">

    <div class="row gy-4">

      <!-- Links -->
      <div class="col-12 col-sm-6">
        <h5>Mais</h5>
        <ul class="nav flex-column">
          <li class="nav-item mb-2"><a href="#" class="nav-link p-0 text-muted">Início</a></li>
          <li class="nav-item mb-2"><a href="#products" class="nav-link p-0 text-muted">Produtos</a></li>
          <li class="nav-item mb-2"><a href="#pricing" class="nav-link p-0 text-muted">Valores</a></li>
          <li class="nav-item mb-2"><a href="#" class="nav-link p-0 text-muted">FAQs</a></li>
          <li class="nav-item mb-2"><a href="https://www.upsee.com.br/" target="_blank" class="nav-link p-0 text-muted">Sobre</a></li>
        </ul>
      </div>

      <!-- Newsletter -->
      <div class="col-12 col-sm-6">
        <form *ngIf="!subscribed" [formGroup]="subscribeForm" (ngSubmit)="submit()">
          <h5>Assine para receber novidades</h5>

          <div class="newsletter-group">
            <input
              id="newsletter1"
              type="email"
              formControlName="email"
              class="form-control"
              placeholder="Endereço de Email"
            />

            <button type="submit" class="btn btn-primary" [disabled]="!subscribeForm.valid || isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm mr-1"></span>
              Assinar
            </button>
          </div>
        </form>

        <div *ngIf="subscribed" class="alert alert-success mt-4" role="alert">
          Obrigado, iremos te atualizar com nossas novidades.
        </div>
      </div>
    </div>

    <div class="footer-bottom d-flex justify-content-between align-items-center py-4 my-4 border-top">
      <p class="m-0">&copy; 2022 Upsee. Todos direitos reservados.</p>
      <ul class="social-links list-unstyled d-flex m-0">
        <li class="ms-3"><a class="link-dark" href="#"><svg class="bi" width="24" height="24"><use xlink:href="#twitter" /></svg></a></li>
        <li class="ms-3"><a class="link-dark" href="#"><svg class="bi" width="24" height="24"><use xlink:href="#instagram" /></svg></a></li>
        <li class="ms-3"><a class="link-dark" href="#"><svg class="bi" width="24" height="24"><use xlink:href="#facebook" /></svg></a></li>
      </ul>
    </div>

  </footer>
</div>
